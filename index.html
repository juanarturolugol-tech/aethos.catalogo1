        function renderCatalog() {

            grid.innerHTML = '';

            products.forEach((prod) => {
                const whatsappNumber = "584244741823";
                // Exact pre-filled URL format requested by user
                const message = encodeURIComponent(`Hola, estoy interesado en el producto ${prod.name}`);
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${message}`;

                const card = document.createElement('div');
                card.className = "product-card rounded-2xl p-4 flex flex-col justify-between cursor-pointer group relative overflow-hidden";
                card.onclick = () => {
                    window.open(whatsappUrl, '_blank');
                };

                card.innerHTML = `
                    <div class="relative w-full h-64 sm:h-72 rounded-xl overflow-hidden bg-black mb-4 border border-zinc-800">
                        <img src="${prod.img}" alt="${prod.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" onerror="this.src='${prod.fallbackImg}'">

                        </h3>
